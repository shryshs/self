---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpleapp-deployment
  namespace: default
  labels:
    app: simpleapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpleapp
  template:
    metadata:
      labels:
        app: simpleapp
    spec:
      containers:
      - name: simpleapp-container
        image: shreyashsomvanshi/simpleapp:v1 # ◄ Replace with your username
        ports:
        - containerPort: 5000
---
